<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Position – Foundational Learning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="nav-placeholder"></div>

<h1>Position</h1>

<div class="module-section">
  <h2>Explore</h2>

  <!-- Above / Below -->
  <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div style="width:40px;height:40px;background:black;border-radius:50%;"></div>
    <div style="width:40px;height:40px;background:gray;border-radius:50%;"></div>
  </div>
  <p>Above &nbsp;&nbsp;&nbsp; Below</p>

  <!-- Inside / Outside -->
  <div style="display:flex; justify-content:center; align-items:center; gap:40px;">
    <div style="width:100px;height:100px;border:3px solid black; display:flex; align-items:center; justify-content:center;">
      <div style="width:30px;height:30px;background:black;border-radius:50%;"></div>
    </div>

    <div style="width:100px;height:100px;border:3px solid black; position:relative;">
      <div style="width:30px;height:30px;background:black;border-radius:50%; position:absolute; top:-40px; left:35px;"></div>
    </div>
  </div>
  <p>Inside &nbsp;&nbsp;&nbsp; Outside</p>

  <div style="margin-top:20px;">
    <button id="continue-btn">Continue</button>
  </div>
</div>

<script src="nav.js"></script>
<script src="app.js"></script>
<script src="position.js"></script>

</body>
</html>

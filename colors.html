<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Colors – Foundational Learning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="nav-placeholder"></div>

<h1>Colors</h1>

<!-- EXPLORE -->
<div class="module-section">
  <h2>Explore</h2>

  <p>This is red.</p>
  <div class="objects">
    <div class="object" style="color:red;">●</div>
  </div>

  <p>This is blue.</p>
  <div class="objects">
    <div class="object" style="color:blue;">●</div>
  </div>

  <p>This is green.</p>
  <div class="objects">
    <div class="object" style="color:green;">●</div>
  </div>

  <p>This is yellow.</p>
  <div class="objects">
    <div class="object" style="color:gold;">●</div>
  </div>
</div>

<hr>

<!-- PRACTICE -->
<div class="module-section">
  <h2>Practice</h2>

  <p id="color-prompt"></p>

  <div class="objects">
    <div class="object color-option" data-color="red" style="color:red;">●</div>
    <div class="object color-option" data-color="blue" style="color:blue;">●</div>
    <div class="object color-option" data-color="green" style="color:green;">●</div>
    <div class="object color-option" data-color="yellow" style="color:gold;">●</div>
  </div>

  <p id="color-feedback" class="feedback"></p>

</div>

<script src="nav.js"></script>
<script src="colors.js"></script>

</body>
</html>

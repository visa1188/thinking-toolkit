<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sizes – Foundational Learning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="nav-placeholder"></div>

<h1>Sizes</h1>

<!-- EXPLORE -->
<div class="module-section">
  <h2>Explore</h2>

  <p>This is small.</p>
  <div class="objects">
    <div class="object" style="font-size:40px;">●</div>
  </div>

  <p>This is medium.</p>
  <div class="objects">
    <div class="object" style="font-size:80px;">●</div>
  </div>

  <p>This is large.</p>
  <div class="objects">
    <div class="object" style="font-size:140px;">●</div>
  </div>
</div>

<hr>

<!-- PRACTICE -->
<div class="module-section">
  <h2>Practice</h2>

  <p id="size-prompt"></p>

  <div class="objects">
    <div class="object size-option" data-size="small" style="font-size:40px;">●</div>
    <div class="object size-option" data-size="medium" style="font-size:80px;">●</div>
    <div class="object size-option" data-size="large" style="font-size:140px;">●</div>
  </div>

  <p id="size-feedback" class="feedback"></p>

</div>

<script src="nav.js"></script>
<script src="sizes.js"></script>

</body>
</html>

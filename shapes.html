<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shapes – Foundational Learning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="nav-placeholder"></div>

<h1>Shapes</h1>

<!-- EXPLORE -->
<div class="module-section">
  <h2>Explore</h2>

  <p>This is a circle.</p>
  <div class="objects">
    <div class="object">●</div>
  </div>

  <p>This is a square.</p>
  <div class="objects">
    <div class="object">■</div>
  </div>

  <p>This is a triangle.</p>
  <div class="objects">
    <div class="object">▲</div>
  </div>

  <p>This is a star.</p>
  <div class="objects">
    <div class="object">★</div>
  </div>
</div>

<hr>

<!-- PRACTICE -->
<div class="module-section">
  <h2>Practice</h2>

  <p id="shape-prompt"></p>

  <div class="objects">
    <div class="object shape-option" data-shape="circle">●</div>
    <div class="object shape-option" data-shape="square">■</div>
    <div class="object shape-option" data-shape="triangle">▲</div>
    <div class="object shape-option" data-shape="star">★</div>
  </div>

  <p id="shape-feedback" class="feedback"></p>

</div>

<script src="nav.js"></script>
<script src="shapes.js"></script>

</body>
</html>
